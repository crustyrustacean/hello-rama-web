[package]
name = "hello-rama-web"
version = "0.8.1"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "A playground for learning how to build a web server with Rama"
readme = "README.md"
repository = "https://github.com/crustyrustacean/hello-rama-web.git"
license = "MIT"
publish = false

[[bin]]
name = "hello-rama-web"
path = "src/bin/main.rs"

[dependencies]
rama = { git = "https://github.com/plabayo/rama.git", tag = "rama-0.3.0-alpha.3", features = [ "http", "http-full" ] }
rust-embed = "8.9.0"
tokio = { version = "1.48.0", features = ["full"] }

[profile.release]
lto = true          # Link-time optimization - slower builds, faster/smaller binaries
codegen-units = 1   # Better optimization at cost of compile time
strip = true        # Strip symbols from binary
panic = "abort"     # Smaller binary, no unwinding (trade-off: no catch_unwind)

[profile.dev]
debug = true        # Full debug info

[profile.dev.package."*"]
opt-level = 2       # Optimize dependencies even in dev (speeds up runtime)

