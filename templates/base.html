<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph -->
  <meta property="og:title" content="Crusty Metallion">
  <meta property="og:description" content="A web template using Rama">
  <meta property="og:url" content="canonical-url-goes-here">
  <meta property="og:type" content="website">

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" type="text/css" href="/static/screen.css" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <title>Rama Web Server | {{ page_title }}</title>
</head>
<body>
  <header id="header">
    <h1>Hello Rama Web</h1>
  </header>
  <main id="main">
    {% block content %}{% endblock content %}
  </main>
  <footer id="footer">
    <p>&copy <span id="year_span">{{ footer_year }}</span> Jeffery D. Mitchell</p>
  </footer>
  <script src="/static/scripts.js"></script>
  <script type="module" src="/static/datastar.js"></script>
</body>
</html>
